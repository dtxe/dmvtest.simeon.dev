- question: 'Which answer correctly applies the California rule tested here: No limit line or crosswalk: stop?'
  choices:
  - After entering intersection
  - Before entering intersection
  - At nearest driveway
  answer: Before entering intersection
  reference: §4 p.14
  reason: Stop before entering the intersection.
- question: 'Which answer correctly applies the California rule tested here: A dedicated right-turn lane that does not merge
    may allow a turn without stopping unless?'
