  - $30,000
  - $15,000
  - $60,000
  answer: $30,000
  reference: §8 p.61
  reason: Current handbook minimum is $30,000.
- question: Minimum liability coverage for death/injury to more than one person?
  choices:
  - $60,000
  - $30,000
  - $100,000
  answer: $60,000
  reference: §8 p.61
  reason: Current handbook minimum is $60,000.
- question: Minimum property-damage liability coverage?
  choices:
  - $15,000
  - $5,000
  - $30,000
  answer: $15,000
  reference: §8 p.61
  reason: Current handbook minimum is $15,000.
- question: Collision without proper insurance can suspend driving privilege up to?
  choices:
  - 4 years
  - 1 year
  - 10 years
  answer: 4 years
  reference: §8 p.61
  reason: The handbook states up to four years.
- question: During the last three years of that suspension, reinstatement may require maintaining?
  choices:
  - SR-22/SR-1P proof
  - Only vehicle registration
  - A passport
  answer: SR-22/SR-1P proof
  reference: §8 p.61
  reason: Proof of insurance must be filed and maintained.
- question: After a collision with injury, call?
  choices:
  - 911 immediately
  - DMV first
  - Insurance only
  answer: 911 immediately
  reference: §8 p.62
  reason: Call 911 right away if anyone is hurt.
- question: Collision with injury or death must be reported to law enforcement within?
  choices:
  - 24 hours
  - 10 days
  - 72 hours
  answer: 24 hours
  reference: §8 p.62
  reason: The law-enforcement report deadline is 24 hours.
- question: DMV SR-1 collision report deadline?
  choices:
  - 10 days
  - 24 hours
  - 30 days
  answer: 10 days
  reference: §8 p.62
  reason: Qualifying collisions must be reported to DMV within 10 days.
- question: DMV collision reporting property-damage threshold?
  choices:
  - More than $1,000
  - At least $500
  - More than $5,000
  answer: More than $1,000
  reference: §8 p.62
  reason: The current handbook says more than $1,000.
- question: Does a minor injury trigger DMV collision reporting?
  choices:
  - 'Yes'
  - No, only hospitalization
  - Only if driver was at fault
  answer: 'Yes'
  reference: §8 p.62
  reason: Any injury or death triggers reporting, even minor injury.
- question: Does a qualifying collision on private property require SR-1 reporting?
  choices:
  - 'Yes'
  - 'No'
  - Only if police respond
  answer: 'Yes'
  reference: §8 p.62
  reason: The reporting rule also applies on private property.
- question: Who must file the SR-1 for a qualifying collision?
  choices:
  - Each driver or representative
  - Only the at-fault driver
  - Law enforcement automatically
  answer: Each driver or representative
  reference: §8 p.62
  reason: Each driver is responsible; law enforcement does not file it for you.
- question: Failure to file a required SR-1 can result in?
  choices:
  - Suspension of driving privilege
  - Only a warning
  - Vehicle title cancellation only
  answer: Suspension of driving privilege
  reference: §8 p.62
  reason: The handbook states driving privilege will be suspended.
- question: If you hit an unattended parked vehicle and cannot find the owner, you should?
  choices:
  - Leave identifying contact information and report the collision
  - Leave without a note
  - Wait exactly 24 hours
  answer: Leave identifying contact information and report the collision
  reference: §8 p.62
  reason: Leave a securely attached note and report the collision.
- question: If you injure an animal with your vehicle, you should?
  choices:
  - Call humane society or law enforcement
  - Move the animal yourself
  - Leave if traffic is heavy
  answer: Call humane society or law enforcement
  reference: §8 p.62
  reason: Call for help and do not try to move an injured animal.
- question: A hit-and-run is?
  choices:
  - Failing to stop or leaving a collision scene
  - Reporting a collision late
  - Driving without collision coverage
  answer: Failing to stop or leaving a collision scene
  reference: §8 p.62
  reason: Drivers involved in collisions must stop.
- question: At a law-enforcement stop, driver must produce?
  choices:
  - License, insurance, and registration
  - Passport and birth certificate
  - Only license
  answer: License, insurance, and registration
  reference: §4 pp.24-25
  reason: The handbook lists all three documents.
- question: During a traffic stop, an officer may require occupants to?
  choices:
  - Exit or remain inside the vehicle
  - Always exit immediately without instruction
  - Refuse all instructions
  answer: Exit or remain inside the vehicle
  reference: §4 p.25
  reason: Drivers and passengers must comply with lawful directions to exit or remain.
- question: When an officer signals you to stop, acknowledge by using?
  choices:
  - Right turn signal
  - Hazard lights only
  - Left turn signal
  answer: Right turn signal
  reference: §4 p.24
  reason: The handbook instructs use of the right turn signal.
- question: At a traffic stop, pull over preferably to?
  choices:
  - The right shoulder
  - The center divider
  - The left lane
  answer: The right shoulder
  reference: §4 p.24
  reason: Move completely onto the right shoulder.
- question: When parking downhill with a curb, front wheels should point?
  choices:
  - Toward the curb
  - Away from curb
  - Straight
  answer: Toward the curb
  reference: §4 Parking
  reason: This helps prevent rolling into traffic.
- question: When parking uphill with a curb, front wheels should point?
  choices:
  - Away from curb
  - Toward curb
  - Straight
  answer: Away from curb
  reference: §4 Parking
  reason: Turn away so rollback catches the curb.
- question: A red curb means?
  choices:
  - No stopping, standing, or parking
  - Passenger loading
  - Disabled parking
  answer: No stopping, standing, or parking
  reference: §4 Parking
  reason: Red prohibits stopping, standing, and parking.
- question: A blue curb means?
  choices:
  - Disabled placard/plate parking
  - Freight loading only
  - No parking
  answer: Disabled placard/plate parking
  reference: §4 Parking
  reason: Blue is reserved for disabled parking.
- question: A white curb generally means?
  choices:
  - Passenger loading/unloading or mail
  - No stopping
  - Long-term parking
  answer: Passenger loading/unloading or mail
  reference: §4 Parking
  reason: White is for brief passenger/mail purposes as posted.
- question: A yellow curb generally means?
  choices:
  - Loading/unloading for posted time
  - Disabled parking
  - No stopping at any time
  answer: Loading/unloading for posted time
  reference: §4 Parking
  reason: Yellow is for loading/unloading subject to local signs/times.
- question: A green curb generally means?
  choices:
  - Limited-time parking
  - No parking
  - Bus only
  answer: Limited-time parking
  reference: §4 Parking
  reason: Green indicates limited-time parking.
- question: When being passed, you should?
  choices:
  - Maintain lane position and speed
  - Speed up
  - Move onto shoulder
  answer: Maintain lane position and speed
  reference: §4 p.17
  reason: Allow the pass; do not increase speed.
- question: Passing on the right may be legal on an open highway when?
  choices:
  - Two or more lanes go your direction
  - Only one lane exists
  - You must use the shoulder
  answer: Two or more lanes go your direction
  reference: §4 p.17
  reason: One permitted case is two or more same-direction lanes.
- question: A vehicle ahead signals left; passing it on the left is?
  choices:
  - Unsafe and should not be done
  - Always required
  - Legal if you honk
  answer: Unsafe and should not be done
  reference: §4 p.17
  reason: Never pass on the left of a vehicle signaling a left turn.
- question: When merging across several lanes, you should?
  choices:
  - Cross one lane at a time
  - Cross all lanes in one movement
  - Stop between lanes
  answer: Cross one lane at a time
  reference: §4 p.16
  reason: Signal and cross lanes one at a time.
- question: At a limit line, stop?
  choices:
  - Before the line
  - With front wheels over it
  - After the crosswalk
  answer: Before the line
  reference: §4 p.14
  reason: Stop behind the limit line.
- question: 'No limit line but crosswalk present: stop?'
  choices:
  - Before entering crosswalk
  - In the middle of crosswalk
  - After crosswalk
  answer: Before entering crosswalk
  reference: §4 p.14
  reason: Stop before the crosswalk.
- question: 'No limit line or crosswalk: stop?'
  choices:
  - Before entering intersection
  - After entering intersection
  - At nearest driveway
  answer: Before entering intersection
  reference: §4 p.14
  reason: Stop before entering the intersection.
- question: A dedicated right-turn lane that does not merge may allow a turn without stopping unless?
  choices:
  - A signal/sign controls that lane
  - Main through-light is red
  - There are no cars
  answer: A signal/sign controls that lane
  reference: §4 p.15
  reason: Obey any signal or sign governing the dedicated lane.
- question: Public transit bus lane may be crossed to?
  choices:
  - Make a right turn
  - Pass traffic
  - Park briefly
  answer: Make a right turn
  reference: §4 p.14
  reason: Crossing is allowed for a right turn.
- question: At a railroad crossing, lowered gates may be driven around?
  choices:
  - Never
  - If no train is visible
  - After 30 seconds
  answer: Never
  reference: §5 p.42
  reason: Never go under or around lowered gates.
- question: After railroad red lights stop?
  choices:
  - Proceed only when safe
  - Proceed while lights still flash if gate rises
  - Always wait five minutes
  answer: Proceed only when safe
  reference: §5 p.42
  reason: Do not cross until flashing red lights stop and it is safe.
- question: If there is not enough room beyond railroad tracks?
  choices:
  - Do not begin crossing
  - Stop on tracks
  - Follow vehicle ahead onto tracks
  answer: Do not begin crossing
  reference: §5 p.42
  reason: Never stop on railroad tracks.
- question: School bus opposite side of divided/multilane highway with 2+ lanes each direction?
  choices:
  - You generally do not need to stop
  - You always must stop
  - You must stop only at night
  answer: You generally do not need to stop
  reference: §5 p.42
  reason: The handbook gives this exception.
- question: Move-over law applies to stationary emergency/tow/road-work vehicles with warning lights?
  choices:
  - 'Yes'
  - 'No'
  - Only at night
  answer: 'Yes'
  reference: §5 p.41
  reason: Drivers must move over and slow down.
- question: Hazardous-load placard vehicles must do what before railroad tracks?
  choices:
  - Stop
  - Accelerate
  - Use hazard lights only
  answer: Stop
  reference: §5 p.41
  reason: Placarded hazardous-load vehicles must stop.
- question: Driving in heavy fog with only parking/fog lights is?
  choices:
  - Not recommended/insufficient; use low beams
  - Required
  - Best practice
  answer: Not recommended/insufficient; use low beams
  reference: §6 p.53
  reason: The handbook says never drive using only parking or fog lights.
- question: A rear-facing child restraint may be placed in front of an active airbag?
  choices:
  - 'No'
  - 'Yes'
  - Only at night
  answer: 'No'
  reference: §6 p.54
  reason: A rear-facing child may not ride in the front seat of an airbag-equipped vehicle.
- question: Leaving a child age 6 or younger unattended is generally?
  choices:
  - Illegal
  - Legal for 30 minutes
  - Legal with windows open
  answer: Illegal
  reference: §6 p.55
  reason: A child six or younger cannot be left unattended.
- question: If hazards exist on both sides, you should?
  choices:
  - Handle one hazard at a time and give more space to the greater danger
  - Split the difference at full speed
  - Stop in your lane
  answer: Handle one hazard at a time and give more space to the greater danger
  reference: §6 p.55
  reason: The handbook advises taking one danger at a time.
- question: A collision report added to your DMV record depends on fault?
  choices:
  - 'No'
  - Yes, only at-fault collisions
  - Only if cited
  answer: 'No'
  reference: §8 p.63
  reason: Qualifying collisions are recorded regardless of fault.
