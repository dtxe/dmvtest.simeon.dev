  reason: Obey any signal or sign governing the dedicated lane.
- question: 'Which answer correctly applies the California rule tested here: Public transit bus lane may be crossed to?'
  choices:
  - Pass traffic
  - Make a right turn
  - Park briefly
  answer: Make a right turn
  reference: §4 p.14
  reason: Crossing is allowed for a right turn.
- question: 'Which answer correctly applies the California rule tested here: At a railroad crossing, lowered gates may be
    driven around?'
