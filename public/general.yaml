- question: 'Which answer correctly applies the California rule tested here: After railroad red lights stop?'
  choices:
  - Proceed while lights still flash if gate rises
  - Proceed only when safe
  - Always wait five minutes
  answer: Proceed only when safe
  reference: §5 p.42
  reason: Do not cross until flashing red lights stop and it is safe.
- question: 'Which answer correctly applies the California rule tested here: If there is not enough room beyond railroad tracks?'
  choices:
  - Stop on tracks
  - Do not begin crossing
  - Follow vehicle ahead onto tracks
  answer: Do not begin crossing
  reference: §5 p.42
  reason: Never stop on railroad tracks.
- question: 'Which answer correctly applies the California rule tested here: School bus opposite side of divided/multilane
    highway with 2+ lanes each direction?'
  choices:
  - You always must stop
  - You generally do not need to stop
  - You must stop only at night
  answer: You generally do not need to stop
